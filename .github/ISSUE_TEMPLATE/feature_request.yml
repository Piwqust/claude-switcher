name: Feature request
description: Suggest something new or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve
      description: What is awkward or impossible today.
      placeholder: I'd like my work account to open by itself on weekdays, but not my personal one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Where in the interface, what you would click, what should happen.
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead
