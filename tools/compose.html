<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>compose</title>
<!--
  Layouts for docs/images, rendered by tools/make-images.ps1 with headless Edge at 2x.
  Open compose.html#<view>&lang=<en|ru> in a browser to preview one. Window captures are 2x,
  so each <img> uses srcset "… 2x" and lays out at its size in DIPs.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; -webkit-font-smoothing: antialiased; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .row { display: flex; gap: 44px; align-items: flex-start; }
  .stage { padding: 40px 56px 72px; width: max-content; }

  /* ------------------------------------------------ a Windows 11 window around a capture */
  .win { position: relative; border-radius: 9px; overflow: hidden; width: max-content;
         box-shadow: 0 0 0 1px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.20), 0 26px 64px -10px rgba(0,0,0,.55); }
  .win.light { box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08), 0 26px 64px -10px rgba(40,20,10,.30); }
  .win::after { content: ""; position: absolute; inset: 0; border-radius: 9px; pointer-events: none;
                box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .win.light::after { box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
  .bar { height: 32px; display: flex; align-items: center; gap: 10px; padding-left: 12px; font-size: 12px; }
  .dark .bar { background: #202020; color: rgba(255,255,255,.86); }
  .light .bar { background: #f3f3f3; color: rgba(0,0,0,.86); }
  .bar img { width: 16px; height: 16px; }
  .bar .x { margin-left: auto; width: 46px; height: 32px; display: grid; place-items: center;
            font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 10px; font-style: normal; }
  .bar .x::before { content: "\E8BB"; }
  .win > img.shot { display: block; }
  .win[class-extra] { -webkit-mask-image: linear-gradient(#000 76%, transparent); mask-image: linear-gradient(#000 76%, transparent); }

  /* the tray corner of the taskbar, under a flyout */
  .tray { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 16px; border-radius: 10px;
          font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 15px; width: max-content; }
  .tray.dark { background: rgba(32,32,32,.94); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 12px 32px rgba(0,0,0,.45); }
  .tray.light { background: rgba(243,243,243,.96); color: #1b1b1b; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 12px 32px rgba(40,20,10,.18); }
  .tray .me { width: 32px; height: 40px; display: grid; place-items: center; border-radius: 5px; }
  .tray.dark .me { background: rgba(255,255,255,.09); } .tray.light .me { background: rgba(0,0,0,.06); }
  .tray .me img { width: 18px; height: 18px; }
  .tray .clock { font-family: "Segoe UI Variable Text", "Segoe UI"; font-size: 12px; line-height: 1.25; text-align: right; }
  .stack { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }

  /* ------------------------------------------------ hero: the copy on the left, a small Windows 11 desktop on the right */
  #hero { width: 1280px; height: 640px; position: relative; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI"; }
  #hero.dark  { --ink: #fff; --ink2: rgba(255,255,255,.66); --ink3: rgba(255,255,255,.46); --line: rgba(255,255,255,.10); --pill: rgba(255,255,255,.06);
                background: radial-gradient(900px 640px at 78% 50%, rgba(217,112,76,.22), transparent 60%),
                            radial-gradient(700px 500px at 0% 100%, rgba(120,90,210,.10), transparent 70%),
                            #0d0b0c; }
  #hero.light { --ink: #1d1613; --ink2: rgba(29,22,19,.66); --ink3: rgba(29,22,19,.48); --line: rgba(29,22,19,.10); --pill: rgba(255,255,255,.7);
                background: radial-gradient(900px 640px at 78% 50%, rgba(217,112,76,.20), transparent 60%),
                            radial-gradient(700px 500px at 0% 100%, rgba(140,110,220,.10), transparent 70%),
                            #f8f4f1; }
  #hero .grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay; pointer-events: none;
                 background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  #hero .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 486px; display: flex; flex-direction: column; justify-content: center; color: var(--ink); }
  #hero .badge { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px;
                 background: var(--pill); border: 1px solid var(--line); font: 600 12.5px "Segoe UI Variable Text", "Segoe UI"; color: var(--ink2); margin-bottom: 26px; }
  #hero .badge img { width: 20px; height: 20px; }
  #hero .badge b { color: #e98a64; font-weight: 700; }
  #hero h1 { font: 700 45px/1.07 "Segoe UI Variable Display", "Segoe UI"; letter-spacing: -1.5px; }
  #hero h1 em { font-style: normal; background: linear-gradient(92deg, #f4a07c 0%, #e0764f 55%, #c95f3c 100%); -webkit-background-clip: text; color: transparent; }
  #hero p { margin-top: 18px; font-size: 17.5px; line-height: 1.5; color: var(--ink2); }
  #hero .stats { display: flex; margin-top: 34px; border-top: 1px solid var(--line); padding-top: 22px; }
  #hero .stat { flex: 1; padding-right: 14px; }
  #hero .stat + .stat { padding-left: 18px; border-left: 1px solid var(--line); }
  #hero .stat b { display: block; font: 700 26px/1 "Segoe UI Variable Display", "Segoe UI"; letter-spacing: -.5px; color: var(--ink); }
  #hero .stat span { display: block; margin-top: 7px; font-size: 12.5px; color: var(--ink3); }

  /* the desktop */
  #hero .desk { position: absolute; left: 584px; top: 40px; width: 656px; height: 560px; border-radius: 18px; overflow: hidden; isolation: isolate;
                box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 40px 90px -20px rgba(0,0,0,.70), 0 0 120px rgba(217,112,76,.18); }
  #hero.light .desk { box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 40px 90px -24px rgba(80,40,20,.35), 0 0 120px rgba(217,112,76,.16); }
  #hero .wall { position: absolute; inset: 0; z-index: -1; background: linear-gradient(165deg, #2b1720 0%, #1a1020 55%, #0f0c18 100%); }
  #hero.light .wall { background: linear-gradient(165deg, #fbe9df 0%, #f3dbe4 55%, #e3dcf3 100%); }
  #hero .blob { position: absolute; border-radius: 50%; filter: blur(34px); }
  #hero .b1 { width: 560px; height: 300px; left: -120px; top: 300px; transform: rotate(-24deg); background: radial-gradient(closest-side, #e47a50, rgba(228,122,80,0)); }
  #hero .b2 { width: 460px; height: 280px; left: 260px; top: 210px; transform: rotate(28deg); background: radial-gradient(closest-side, #a83a6c, rgba(168,58,108,0)); }
  #hero .b3 { width: 360px; height: 360px; left: 380px; top: -120px; background: radial-gradient(closest-side, #f0a05e, rgba(240,160,94,0)); opacity: .75; }
  #hero .b4 { width: 420px; height: 420px; left: 420px; top: 330px; background: radial-gradient(closest-side, #5b44c4, rgba(91,68,196,0)); opacity: .8; }
  #hero.light .blob { opacity: .55; }
  #hero .bloom { position: absolute; left: 0; top: 0; mix-blend-mode: screen; filter: blur(1.5px) saturate(115%); }
  #hero.light .bloom { mix-blend-mode: multiply; opacity: .55; }
  #hero .sheen { position: absolute; width: 900px; height: 900px; left: -260px; top: 120px; border-radius: 50%;
                 background: conic-gradient(from 200deg, transparent 0deg, rgba(255,255,255,.10) 40deg, transparent 90deg, rgba(255,255,255,.06) 160deg, transparent 220deg);
                 filter: blur(18px); }

  #hero .w-picker { position: absolute; left: 26px; top: 26px; transform: scale(.78); transform-origin: 0 0; }
  #hero .w-flyout { position: absolute; right: 14px; bottom: 62px; transform: scale(.78); transform-origin: 100% 100%; }

  #hero .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: center;
                   backdrop-filter: blur(24px) saturate(140%); }
  #hero.dark .taskbar  { background: rgba(28,28,30,.80); border-top: 1px solid rgba(255,255,255,.07); color: #fff; }
  #hero.light .taskbar { background: rgba(243,243,243,.82); border-top: 1px solid rgba(0,0,0,.06); color: #1b1b1b; }
  #hero .apps { display: flex; gap: 4px; }
  #hero .app { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 5px; }
  #hero .app img { width: 24px; height: 24px; }
  #hero .app.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 6px; height: 3px; margin-left: -3px; border-radius: 2px; background: currentColor; opacity: .5; }
  #hero .app.front { background: rgba(255,255,255,.08); }
  #hero.light .app.front { background: rgba(0,0,0,.05); }
  #hero .app.front::after { width: 16px; margin-left: -8px; background: #e0764f; opacity: 1; }
  #hero .corner { position: absolute; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
                  font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 13px; }
  #hero .corner .me { width: 30px; height: 38px; display: grid; place-items: center; border-radius: 5px; background: rgba(255,255,255,.10); }
  #hero.light .corner .me { background: rgba(0,0,0,.06); }
  #hero .corner .me img { width: 16px; height: 16px; }
  #hero .corner .clock { font: 11.5px/1.25 "Segoe UI Variable Text", "Segoe UI"; text-align: right; }

  /* ------------------------------------------------ theme split */
  .split { position: relative; }
  .split .layer { position: absolute; inset: 0; }
  .split .layer.light { clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); }
  .split svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ------------------------------------------------ icons */
  .icons { display: grid; grid-template-columns: repeat(5, 168px); border-radius: 16px; overflow: hidden;
           box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 20px 50px -12px rgba(0,0,0,.35); }
  .icons .cell { height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 600 12px "Segoe UI Variable Text", "Segoe UI"; }
  .icons .d { background: linear-gradient(180deg, #262626, #1d1d1d); color: #cfcfcf; }
  .icons .l { background: linear-gradient(180deg, #fbfbfb, #efefef); color: #555; }
  .icons .sizes { display: flex; align-items: flex-end; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.hash.slice(1).replace(/^([^&=]+)(?=&|$)/, 'view=$1'));
const view = params.get('view') || 'hero-dark', lang = params.get('lang') || 'en';
const L = {
  en: { picker: 'Claude Accounts', settings: 'Settings — Claude Accounts',
        badge: '<b>v1.0</b> · rewritten in native C++',
        h1: 'Every Claude account,<br><em>one click away.</em>',
        p: 'Run several Claude Desktop accounts side by side on Windows, each in its own window and all of them signed in.',
        stats: [['75 ms', 'to the picker'], ['550 KB', 'one exe, no runtime'], ['16 MB', 'waiting in the tray']],
        icons: ['Switcher', 'Main', 'Account 2', 'Work', 'Add account'], clock: ['10:41', '16.10.2026'] },
  ru: { picker: 'Аккаунты Claude', settings: 'Настройки — Аккаунты Claude',
        badge: '<b>v1.0</b> · переписан на C++',
        h1: 'Все аккаунты Claude<br><em>в один клик.</em>',
        p: 'Несколько аккаунтов Claude Desktop сразу: каждый в своём окне и без выхода из аккаунта.',
        stats: [['75 мс', 'до окна выбора'], ['550 КБ', 'один exe без среды'], ['16 МБ', 'в трее']],
        icons: ['Переключатель', 'Основной', 'Account 2', 'Work', 'Добавить'], clock: ['10:41', '16.10.2026'] },
}[lang];

const bloom = (theme) => {
  const petals = [-14, -30, -46, -62, -78, -94].map((a, i) =>
    `<ellipse cx="230" cy="0" rx="250" ry="${70 - i * 5}" transform="rotate(${a})" fill="url(#pg${i % 2})"/>`).join('');
  return `<svg class="bloom" viewBox="0 0 656 560" width="656" height="560"><defs>
      <linearGradient id="pg0" x1="0" x2="1"><stop offset="0" stop-color="#ffb08a" stop-opacity="0"/><stop offset=".55" stop-color="#ec7c55" stop-opacity=".55"/><stop offset="1" stop-color="#b8436f" stop-opacity=".9"/></linearGradient>
      <linearGradient id="pg1" x1="0" x2="1"><stop offset="0" stop-color="#ffcf9e" stop-opacity="0"/><stop offset=".6" stop-color="#d9617a" stop-opacity=".5"/><stop offset="1" stop-color="#6d4cc9" stop-opacity=".85"/></linearGradient>
    </defs><g transform="translate(40 600)">${petals}</g></svg>`;
};
const shot = (file) => `<img class="shot" srcset="${file} 2x" alt="">`;
const win = (theme, file, title, attrs = '') =>
  `<div class="win ${theme}" ${attrs}><div class="bar"><img srcset="ico/app-32.png 2x" alt=""><span>${title}</span><i class="x"></i></div>${shot(file)}</div>`;
const flyout = (theme) => `<div class="win ${theme}">${shot(`flyout-${theme}.png`)}</div>`;
const tray = (theme) => `<div class="tray ${theme}"><span>&#xE70E;</span><span>&#xE701;</span><span>&#xE767;</span>
  <span class="me"><img srcset="ico/app-32.png 2x" alt=""></span><span class="clock">${L.clock[0]}<br>${L.clock[1]}</span></div>`;

const views = {
  hero: (theme) => `
    <div id="hero" class="${theme}"><div class="grain"></div>
      <div class="copy">
        <div class="badge"><img srcset="ico/app-64.png 3.2x" alt="">${L.badge}</div>
        <h1>${L.h1}</h1>
        <p>${L.p}</p>
        <div class="stats">${L.stats.map(([b, t]) => `<div class="stat"><b>${b}</b><span>${t}</span></div>`).join('')}</div>
      </div>
      <div class="desk">
        <div class="wall"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="sheen"></div>${bloom(theme)}</div>
        <div class="w-picker">${win(theme, `picker-${theme}.png`, L.picker)}</div>
        <div class="w-flyout">${flyout(theme)}</div>
        <div class="taskbar">
          <div class="apps">
            <span class="app front"><img srcset="ico/app-64.png 2.67x" alt=""></span>
            <span class="app on"><img srcset="ico/account-1-64.png 2.67x" alt=""></span>
            <span class="app on"><img srcset="ico/account-2-64.png 2.67x" alt=""></span>
            <span class="app"><img srcset="ico/account-3-64.png 2.67x" alt=""></span>
          </div>
          <div class="corner"><span>&#xE70E;</span><span class="me"><img srcset="ico/app-32.png 2x" alt=""></span><span>&#xE701;</span><span>&#xE767;</span>
            <span class="clock">${L.clock[0]}<br>${L.clock[1]}</span></div>
        </div>
      </div>
    </div>`,
  picker: (theme) => `<div class="stage">${win(theme, `picker-${theme}.png`, L.picker)}</div>`,
  startup: (theme) => `<div class="stage">${win(theme, `startup-${theme}.png`, L.picker)}</div>`,
  tray: () => `<div class="stage row">${['dark', 'light'].map(t => `<div class="stack">${flyout(t)}${tray(t)}</div>`).join('')}</div>`,
  themes: () => `<div class="stage"><div class="split">
      <div style="visibility:hidden">${win('dark', 'picker-dark.png', L.picker)}</div>
      <div class="layer">${win('dark', 'picker-dark.png', L.picker)}</div>
      <div class="layer light">${win('light', 'picker-light.png', L.picker)}</div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="58" y1="0" x2="42" y2="100" stroke="rgba(255,255,255,.9)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    </div></div>`,
  settings: () => `<div class="stage row">${['dark', 'light'].map(t =>
      win(t, `settings-${t}.png`, L.settings, 'style="height:620px" class-extra')).join('')}</div>`,
  icons: () => {
    const files = ['app', 'default', 'a2', 'w', 'add'];
    const cell = (cls, f, name) => `<div class="cell ${cls}"><div class="sizes">
        <img srcset="ico/${f}.png 4x" alt=""><img srcset="ico/${f}-64.png 2x" alt=""><img srcset="ico/${f}-32.png 2x" alt=""></div>${name}</div>`;
    return `<div class="stage"><div class="icons">${files.map((f, i) => cell('d', f, L.icons[i])).join('')}${files.map((f, i) => cell('l', f, L.icons[i])).join('')}</div></div>`;
  },
};
const [name, theme] = view.split('-');
document.getElementById('root').innerHTML = views[name](theme || 'dark');
</script>
</body>
</html>
