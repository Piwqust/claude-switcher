<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>compose</title>
<!--
  Layouts for docs/images, rendered by tools/make-images.ps1 with headless Edge at 2x.
  Open compose.html#<view>&lang=<en|ru> in a browser to preview one. Window captures are 2x,
  so each <img> uses srcset "… 2x" and lays out at its size in DIPs.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; -webkit-font-smoothing: antialiased; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .row { display: flex; gap: 44px; align-items: flex-start; }
  .stage { padding: 40px 56px 72px; width: max-content; }

  /* ------------------------------------------------ a Windows 11 window around a capture */
  .win { position: relative; border-radius: 9px; overflow: hidden; width: max-content;
         box-shadow: 0 0 0 1px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.20), 0 26px 64px -10px rgba(0,0,0,.55); }
  .win.light { box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08), 0 26px 64px -10px rgba(40,20,10,.30); }
  .win::after { content: ""; position: absolute; inset: 0; border-radius: 9px; pointer-events: none;
                box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .win.light::after { box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
  .bar { height: 32px; display: flex; align-items: center; gap: 10px; padding-left: 12px; font-size: 12px; }
  .dark .bar { background: #202020; color: rgba(255,255,255,.86); }
  .light .bar { background: #f3f3f3; color: rgba(0,0,0,.86); }
  .bar img { width: 16px; height: 16px; }
  .bar .x { margin-left: auto; width: 46px; height: 32px; display: grid; place-items: center;
            font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 10px; font-style: normal; }
  .bar .x::before { content: "\E8BB"; }
  .win > img.shot { display: block; }
  .win[class-extra] { -webkit-mask-image: linear-gradient(#000 76%, transparent); mask-image: linear-gradient(#000 76%, transparent); }

  /* the tray corner of the taskbar, under a flyout */
  .tray { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 16px; border-radius: 10px;
          font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 15px; width: max-content; }
  .tray.dark { background: rgba(32,32,32,.94); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 12px 32px rgba(0,0,0,.45); }
  .tray.light { background: rgba(243,243,243,.96); color: #1b1b1b; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 12px 32px rgba(40,20,10,.18); }
  .tray .me { width: 32px; height: 40px; display: grid; place-items: center; border-radius: 5px; }
  .tray.dark .me { background: rgba(255,255,255,.09); } .tray.light .me { background: rgba(0,0,0,.06); }
  .tray .me img { width: 18px; height: 18px; }
  .tray .clock { font-family: "Segoe UI Variable Text", "Segoe UI"; font-size: 12px; line-height: 1.25; text-align: right; }
  .stack { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }

  /* ------------------------------------------------ theme split */
  .split { position: relative; }
  .split .layer { position: absolute; inset: 0; }
  .split .layer.light { clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); }
  .split svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ------------------------------------------------ icons */
  .icons { display: grid; grid-template-columns: repeat(5, 168px); border-radius: 16px; overflow: hidden;
           box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 20px 50px -12px rgba(0,0,0,.35); }
  .icons .cell { height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 600 12px "Segoe UI Variable Text", "Segoe UI"; }
  .icons .d { background: linear-gradient(180deg, #262626, #1d1d1d); color: #cfcfcf; }
  .icons .l { background: linear-gradient(180deg, #fbfbfb, #efefef); color: #555; }
  .icons .sizes { display: flex; align-items: flex-end; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.hash.slice(1).replace(/^([^&=]+)(?=&|$)/, 'view=$1'));
const view = params.get('view') || 'picker-dark', lang = params.get('lang') || 'en';
const L = {
  en: { picker: 'Claude Accounts', settings: 'Settings — Claude Accounts',
        icons: ['Switcher', 'Main', 'Account 2', 'Work', 'Add account'], clock: ['10:41', '16.10.2026'] },
  ru: { picker: 'Аккаунты Claude', settings: 'Настройки — Аккаунты Claude',
        icons: ['Переключатель', 'Основной', 'Account 2', 'Work', 'Добавить'], clock: ['10:41', '16.10.2026'] },
}[lang];

const shot = (file) => `<img class="shot" srcset="${file} 2x" alt="">`;
const win = (theme, file, title, attrs = '') =>
  `<div class="win ${theme}" ${attrs}><div class="bar"><img srcset="ico/app-32.png 2x" alt=""><span>${title}</span><i class="x"></i></div>${shot(file)}</div>`;
const flyout = (theme) => `<div class="win ${theme}">${shot(`flyout-${theme}.png`)}</div>`;
const tray = (theme) => `<div class="tray ${theme}"><span>&#xE70E;</span><span>&#xE701;</span><span>&#xE767;</span>
  <span class="me"><img srcset="ico/app-32.png 2x" alt=""></span><span class="clock">${L.clock[0]}<br>${L.clock[1]}</span></div>`;

const views = {
  picker: (theme) => `<div class="stage">${win(theme, `picker-${theme}.png`, L.picker)}</div>`,
  startup: (theme) => `<div class="stage">${win(theme, `startup-${theme}.png`, L.picker)}</div>`,
  tray: () => `<div class="stage row">${['dark', 'light'].map(t => `<div class="stack">${flyout(t)}${tray(t)}</div>`).join('')}</div>`,
  themes: () => `<div class="stage"><div class="split">
      <div style="visibility:hidden">${win('dark', 'picker-dark.png', L.picker)}</div>
      <div class="layer">${win('dark', 'picker-dark.png', L.picker)}</div>
      <div class="layer light">${win('light', 'picker-light.png', L.picker)}</div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="58" y1="0" x2="42" y2="100" stroke="rgba(255,255,255,.9)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    </div></div>`,
  settings: () => `<div class="stage row">${['dark', 'light'].map(t =>
      win(t, `settings-${t}.png`, L.settings, 'style="height:620px" class-extra')).join('')}</div>`,
  icons: () => {
    const files = ['app', 'default', 'a2', 'w', 'add'];
    const cell = (cls, f, name) => `<div class="cell ${cls}"><div class="sizes">
        <img srcset="ico/${f}.png 4x" alt=""><img srcset="ico/${f}-64.png 2x" alt=""><img srcset="ico/${f}-32.png 2x" alt=""></div>${name}</div>`;
    return `<div class="stage"><div class="icons">${files.map((f, i) => cell('d', f, L.icons[i])).join('')}${files.map((f, i) => cell('l', f, L.icons[i])).join('')}</div></div>`;
  },
};
const [name, theme] = view.split('-');
document.getElementById('root').innerHTML = views[name](theme || 'dark');
</script>
</body>
</html>
